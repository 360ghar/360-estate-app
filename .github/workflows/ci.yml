name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Forbid /api/v1 literals in call sites
        run: |
          if grep -rnE "['\"]/api/v1" lib --include="*.dart" | grep -v "CI greps for" | grep -v "const prefix = '/api/v1'"; then
            echo "Found '/api/v1' literal in lib/. Use ApiPaths (base URL already includes /api/v1)."
            exit 1
          fi

      - name: Verify codegen is up to date
        # Fails when a model change landed without regenerating .freezed/.g
        # files, or when generated files were hand-edited.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce minimum coverage (10%)
        run: |
          python3 - <<'EOF'
          import sys
          found = hit = 0
          try:
              with open('coverage/lcov.info') as f:
                  for line in f:
                      if line.startswith('LF:'):
                          found += int(line.strip().split(':')[1])
                      elif line.startswith('LH:'):
                          hit += int(line.strip().split(':')[1])
          except FileNotFoundError:
              print('coverage/lcov.info not found')
              sys.exit(1)
          pct = (hit / found * 100) if found else 0
          print(f'Line coverage: {hit}/{found} ({pct:.1f}%)')
          # Suite sits at ~13% (2026-09); raise toward 30% as coverage grows.
          if pct < 10:
              print('Coverage below 10% gate')
              sys.exit(1)
          EOF

  build:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug
